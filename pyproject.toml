[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rasattrading-mcp"
version = "0.1.0"
description = "A Binance price-action/liquidity-focused MCP server for AI agents (daemon + thin MCP adapter)"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.29.0,<2.0",
  "aiohttp>=3.9.0",
  "websockets>=12.0",
  "psutil>=5.9",
  "keyring>=24.0",
  "pywin32>=306; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
]

[project.scripts]
rasattrading-mcp = "rasattrading_mcp.adapter.main:main"
rasattrading-daemon = "rasattrading_mcp.daemon.main:main"
rasattrading-emergency-stop = "rasattrading_mcp.emergency_stop:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
